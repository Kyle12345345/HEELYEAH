<!DOCTYPE html>
<html lang="en">
<head>

    <title>heelYeah!</title>
    <link rel="icon" href="{{ url_for('static', filename='images/icon.jpg') }}" type="image/x-icon">

    <body style = "background-color: #CDCCCC;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>


    <nav class="header">

            </a>
        </div>

        <div id="cart-alert" style="display: none;" class="alert">
            Product is added to your cart successfully.
          </div>
          

        <div class="navigation">
            <button class="nav-btn">New Arrivals</button>

            <button class="nav-btn">Women</button>
            
            <div class="dropdown">

                <ul class="dropdown-menu">
                    <li><a href="nike">Nike</a></li>
                    <li><a href="adidas">Adidas</a></li>

                    <li><a href="converse">Converse</a></li>
                    <li><a href="puma">Puma</a></li>
                </ul>
            </div>
        </div>

    </nav><br>

            <img src="{{ url_for('static', filename='adidas_images/adidas ci.png')}}" alt="Center Image">

        <div class="gender-container">

            <div class="gender-options">
                <label>
                    <input type="checkbox" id="men-filter">

                <label>

        </div>

        </div>

             <i class="fas fa-chevron-right"></i>
