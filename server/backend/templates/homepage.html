<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#808080">
    <title>heelYeah! - Home</title>
    <link rel="icon" href="{{ url_for('static', filename='images/icon.jpg') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/homepage.css') }}">
    <body style = "background-color: #CDCCCC;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

</head>
     
<body>

    <nav class="header">
        <div class="logo">
            <a href="{{ url_for('views.homepage') }}">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" width="170" height="50" alt="logo">
            </a>
        </div>

        <div class="navigation">
            <button class="nav-btn">New Arrivals</button>
            <a href="{{ url_for('views.men')}}"><button class="nav-btn">Men</button></a>
            <a href="{{ url_for('views.women')}}"><button class="nav-btn">Women</button></a>
            
            <div class="dropdown">
                <button class="nav-btn dropdown-btn">Brands</button>
                <ul class="dropdown-menu">
                    <li><a href="{{ url_for('views.nike') }}">Nike</a></li>
                    <li><a href="{{ url_for('views.adidas')}}">Adidas</a></li>
                    <li><a href="{{ url_for('views.newbalance')}}">New Balance</a></li>
                    <li><a href="{{ url_for('views.converse')}}">Converse</a></li>
                    <li><a href="{{ url_for('views.puma')}}">Puma</a></li>
                </ul>
            </div>
        </div>

        <div class="nav-icons">
            <a href="{{ url_for('auth.profile') if session.get('logged_in') else url_for('auth.login') }}">
                <i class="fas fa-user"></i>
            </a>
            <a href="{{ url_for('views.cart') }}"><i class="fas fa-shopping-cart"></i></a>
            {% if session.get('logged_in') %}
                <a href="{{ url_for('auth.logout') }}">
                    <i class="fas fa-sign-out-alt"></i>
                </a>
            {% endif %}
        </div>
        
    </nav><br>


    <header class="hero-carousel">
        <div class="slides">
            <div class="slide active">
                <img src="{{ url_for('static', filename='images/nike.jpg') }}" alt="Slide 1">
            </div>
            <div class="slide">
                <img src="{{ url_for('static', filename='images/adidas.jpg') }}" alt="Slide 2">
            </div>
            <div class="slide">
                <img src="{{ url_for('static', filename='images/puma.jpg') }}" alt="Slide 3">
            </div>
        </div>

        
        <div class="dots">
            <span class="dot active" onclick="currentSlide(0)"></span>
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
        </div>
    </header><br>

    <div class="brand-logos">
        <a href="{{url_for('views.nike')}}">
            <img src="{{ url_for('static', filename='images/lgN.png') }}" alt="Nike">
        </a>
        <a href="{{url_for('views.adidas')}}">
            <img src="{{ url_for('static', filename='images/lgA.png') }}" alt="Adidas">
        </a>
        <a href="{{url_for('views.newbalance')}}">
            <img src="{{ url_for('static', filename='images/lgB.png') }}" alt="New Balance">
        </a>
        <a href="{{url_for('views.puma')}}">
            <img src="{{ url_for('static', filename='images/lg.png') }}" alt="Puma">
        </a>
        <a href="{{url_for('views.converse')}}">
            <img src="{{ url_for('static', filename='images/lgC.png') }}" alt="Converse">
        </a>
        
        
    </div><br>
    
    <div class="slider-container">
        <div class="slider">
            <img src="{{ url_for('static', filename='images/posterNK.png') }}" alt="Brand 6" class="clone">
            <img src="{{ url_for('static', filename='images/posterN.png') }}" alt="Brand 1">
            <img src="{{ url_for('static', filename='images/posterA.png') }}" alt="Brand 2">
            <img src="{{ url_for('static', filename='images/posterNB.png') }}" alt="Brand 3">
            <img src="{{ url_for('static', filename='images/posterC.png') }}" alt="Brand 4">
            <img src="{{ url_for('static', filename='images/posterP.png') }}" alt="Brand 5">
            <img src="{{ url_for('static', filename='images/posterNK.png') }}" alt="Brand 6">
            <img src="{{ url_for('static', filename='images/posterN.png') }}" alt="Brand 1" class="clone"> 
        </div>
    </div>
    
    <div class="container">
        <h1>Shop by Gender</h1>
        <div class="shop-categories">
            <div class="category">
                <a href="{{ url_for('views.men')}}"><img src="{{ url_for('static', filename='images/MAD.jpg') }}" alt="Men"></a>
                <div class="category-title">MEN</div>
            </div>
            <div class="category">
                <a href="{{ url_for('views.women')}}"><img src="{{ url_for('static', filename='images/ADWM.jpg') }}" alt="Women"></a>
                <div class="category-title">WOMEN</div>
            </div>
            <div class="category new-arrivals">
                <img src="{{ url_for('static', filename='images/NA.jpg') }}" alt="New Arrivals">
                <div class="category-title">NEW ARRIVALS</div>
            </div>
        </div>
    </div>
    
    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>About</h4>
                <ul>
                    <li><a href="{{ url_for('views.aboutus')}}">About us</a></li>
                    <li><a href="{{ url_for('views.termsandconditions')}}">Terms & Conditions</a></li>
                    <li><a href="{{ url_for('views.privacypolicy')}}">Privacy Policy</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>Customer Service</h4>
                <ul>
                    <li><a href="{{ url_for('views.faq')}}">FAQ</a></li>
                    <li><a href="{{ url_for('views.contactus')}}">Contact us</a></li>
                </ul>
            </div>
        </div>
    </footer>
    

    <script src="{{ url_for('static', filename='js/homepage.js') }}"></script>
    
    
</body>
</html>
