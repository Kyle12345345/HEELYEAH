<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#808080">
    <title>heelYeah! - Checkout</title>
    <link rel="icon" href="{{ url_for('static', filename='images/icon.jpg') }}" type="image/x-icon">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/checkout.css') }}">
    <body style = "background-color: #CDCCCC;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/0.4.1/html2canvas.min.js"></script>
</head>
     
<body>

    <header class="header">
        <div class="logo">
            <a href="{{ url_for('views.homepage') }}">
                <img src="{{ url_for('static', filename='images/logo.jpg') }}" width="170" height="50" alt="logo">
            </a>
        </div>
    
        <button class="hamburger" onclick="toggleMenu()">
            <div></div>
            <div></div>
            <div></div>
        </button>
    
        <nav class="navigation" id="navMenu">
            <a href="{{ url_for('views.men') }}"><button class="nav-btn">Men</button></a>
            <a href="{{ url_for('views.women') }}"><button class="nav-btn">Women</button></a>
    
            <div class="dropdown">
                <button class="nav-btn dropdown-btn">Brands</button>
                <ul class="dropdown-menu">
                    <li><a href="{{ url_for('views.nike') }}">Nike</a></li>
                    <li><a href="{{ url_for('views.adidas') }}">Adidas</a></li>
                    <li><a href="{{ url_for('views.newbalance') }}">New Balance</a></li>
                    <li><a href="{{ url_for('views.converse') }}">Converse</a></li>
                    <li><a href="{{ url_for('views.puma') }}">Puma</a></li>
                </ul>
            </div>
    
            <!-- Icons now inside the hamburger nav -->
            <div class="nav-icons">
                <a href="{{ url_for('auth.profile') if session.get('logged_in') else url_for('auth.login') }}">
                    <i class="fas fa-user"></i>
                </a>
                <a href="{{ url_for('views.cart') }}"><i class="fas fa-shopping-cart"></i></a>
                {% if session.get('logged_in') %}
                    <a href="{{ url_for('auth.logout') }}" id="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                    </a>
                {% endif %}
            </div>
        </nav>
    </header>
    
    <br>
    
    <div class="checkout-container">
        <h1>Checkout</h1>
      
        <div class="cards-grid">
      
          <!-- Shipping Details Card -->
          <div class="card">
            <h2>Shipping Details</h2>
            <form id="address-form">
              <input type="text" id="fullname" placeholder="Full Name" required>
              <input type="text" id="street" placeholder="Street Address, Barangay" required>
              <input type="text" id="city" placeholder="City" required>
              <input type="text" id="province" placeholder="State/Province" required>
              <input type="text" id="zip" placeholder="Zip Code" required>
              <input type="text" id="country" placeholder="Country" required>
              <button type="submit">Save Address</button>
            </form>
            <div id="saved-address" ></div>
          </div>
      
          <!-- Order Summary Card -->
          <div class="card">
            <h2>Order Summary</h2>
            <div id="order-summary">
              <!-- Product details will be injected here -->
            </div>
          </div>
      
          <!-- Tracking Details Card -->
          <div class="card">
            <h2>Tracking Details</h2>
            
            <div id="tracking-info">
              <!-- Tracking steps will be injected here -->
            </div>
          
            <div class="place-order-container">
                <button id="place-order-btn">Place Order</button>
            </div>
          </div>
          
          
          
        </div>
      
      </div>
      

      <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>About</h4>
                <ul>
                    <li><a href="{{ url_for('views.aboutus')}}">About us</a></li>
                    <li><a href="{{ url_for('views.termsandconditions')}}">Terms & Conditions</a></li>
                    <li><a href="{{ url_for('views.privacypolicy')}}">Privacy Policy</a></li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>Customer Service</h4>
                <ul>
                    <li><a href="{{ url_for('views.faq')}}">FAQ</a></li>
                    <li><a href="{{ url_for('views.contactus')}}">Contact us</a></li>
                </ul>
            </div>
        </div>
    </footer>

    
    <script src="{{ url_for('static', filename='js/checkout.js') }}"></script>
    <script src="{{ url_for('static', filename='js/logout.js') }}"></script>
    
</body>
</html>
