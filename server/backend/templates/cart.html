<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#808080">
    <title>heelYeah!</title>
    <link rel="icon" href="icon.jpg" type="image/x-icon"> 
    <link rel="stylesheet" type="text/css" href="cart.css" />
    <body style="background-color: #CDCCCC;">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://kit.fontawesome.com/your-fontawesome-kit.js" crossorigin="anonymous"></script>
</head>

<body>

    <nav class="header">
        <div class="logo">
            <a href="homepage.html">
                <img src="logo.jpg" width="170" height="50" alt="logo">
            </a>
        </div>

        <div class="navigation">
            <button class="nav-btn">New Arrivals</button>
            <button class="nav-btn">Men</button>
            <button class="nav-btn">Women</button>
            
            <div class="dropdown">
                <button class="nav-btn dropdown-btn">Brands</button>
                <ul class="dropdown-menu">
                    <li><a href="nike.html">Nike</a></li>
                    <li><a href="#">Adidas</a></li>
                    <li><a href="#">New Balance</a></li>
                    <li><a href="converse.html">Converse</a></li>
                    <li><a href="#">Puma</a></li>
                </ul>
            </div>
        </div>

        <div class="nav-icons">
            <a href="login.html"><i class="fas fa-user"></i></a>
            <a href="cart.html"><i class="fas fa-shopping-cart"></i></a>
        </div>
    </nav><br>

    <main>
        <section class="cart" id="cart">
          <!-- Cart items will be loaded here from localStorage -->
          <div id="cartTotal" class="cart-total"></div>
        </section>
    
        <div class="bottom-bar" id="bottomBar" style="display: none;">
            <div class="select-all">
                <input type="checkbox" id="select-all" />
                <label for="select-all">Select All</label>
            </div>
        
            <button class="trash" onclick="clearCart()">
                <i class="fas fa-trash"></i>
            </button>
        
            <div id="totalAmount" class="total-text">Total: ₱0</div>
        
            <button class="checkout">CHECK OUT</button>
        </div>
        
    </main>

    <footer>
        <div class="footer-content">
            <div class="footer-section">
                <h4>About</h4>
                <ul>
                    <li>About us</li>
                    <li>Terms & Conditions</li>
                    <li>Privacy Policy</li>
                </ul>
            </div>
            <div class="footer-section">
                <h4>Customer Service</h4>
                <ul>
                    <li>FAQ</li>
                    <li>Contact us</li>
                </ul>
            </div>
        </div>
    </footer>

    <script src="cart.js"></script>

</body>
</html>
